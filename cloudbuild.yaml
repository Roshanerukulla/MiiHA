steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--no-cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/iui-info-hcc-hci/cloud-run-source-deploy/miiha/miha:$COMMIT_SHA'
      - .
      - '-f'
      - Dockerfile

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'us-central1-docker.pkg.dev/iui-info-hcc-hci/cloud-run-source-deploy/miiha/miha:$COMMIT_SHA'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - miha-chatbot   # 👈 use your Cloud Run service name here
      - '--image=us-central1-docker.pkg.dev/iui-info-hcc-hci/cloud-run-source-deploy/miiha/miha:$COMMIT_SHA'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--quiet'

images:
  - 'us-central1-docker.pkg.dev/iui-info-hcc-hci/cloud-run-source-deploy/miiha/miha:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
